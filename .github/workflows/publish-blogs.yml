name: Publish blogs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "blogs/**"
      - ".github/workflows/publish-blogs.yml"
  pull_request:
    paths:
      - "blogs/**"
      - ".github/workflows/publish-blogs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-blogs-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: blogs

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudunits2-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::knitr
            any::rmarkdown
            any::edr4r
            any::dplyr
            any::sf
            any::ggplot2
            any::leaflet
            any::lubridate

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render blogs
        run: quarto render

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload rendered site
        uses: actions/upload-pages-artifact@v3
        with:
          path: blogs/_site

  deploy:
    # Publishing is skipped on pull requests; those runs only verify that the
    # blogs still render.
    if: github.event_name != 'pull_request'
    needs: render
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
